<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>nunoken Logo Lockup — Internal Review</title>
  <style>
    :root{--ink:#111314;--paper:#f1f0eb;--line:#d3d4cf;--muted:#666b69;--accent:#c8ff2e}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Segoe UI","Yu Gothic UI",sans-serif}main{width:min(1100px,calc(100% - 40px));margin:auto;padding:64px 0 100px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted)}h1{margin:14px 0 42px;font-size:clamp(46px,7vw,84px);font-weight:560;letter-spacing:-.06em}.board{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}.panel{min-width:0;min-height:390px;display:grid;place-items:center;padding:54px}.panel img{display:block;width:100%;max-width:500px}.panel.dark{background:var(--ink)}.sizes{margin-top:24px;padding:38px;background:#fff;border:1px solid var(--line)}.sizes h2{margin:0 0 34px;font-size:11px;letter-spacing:.15em}.size-row{display:flex;flex-direction:column;align-items:flex-start;gap:30px}.size-row img:nth-child(1){width:min(100%,420px)}.size-row img:nth-child(2){width:min(75%,280px)}.size-row img:nth-child(3){width:min(50%,170px)}.note{margin-top:28px;padding:22px;border-left:3px solid var(--accent);color:var(--muted);font-size:13px;line-height:1.8}@media(max-width:720px){main{padding-top:40px}.board{grid-template-columns:1fr}.panel{min-height:230px;padding:32px}.sizes{padding:28px 22px}}
  </style>
</head>
<body>
<main>
  <span class="eyebrow">BRAND LOCKUP · 03</span>
  <h1>Trace × nunoken.</h1>
  <section class="board" aria-label="通常版と反転版">
    <div class="panel"><img src="nunoken-logo.svg" alt="Traceシンボルとnunokenワードマークを組み合わせた通常版ロゴ"></div>
    <div class="panel dark"><img src="nunoken-logo-reverse.svg" alt="ダーク背景用の反転版ロゴ"></div>
  </section>
  <section class="sizes" aria-labelledby="size-title">
    <h2 id="size-title">SIZE CHECK</h2>
    <div class="size-row"><img src="nunoken-logo.svg" alt="大サイズ表示"><img src="nunoken-logo.svg" alt="中サイズ表示"><img src="nunoken-logo.svg" alt="小サイズ表示"></div>
  </section>
  <p class="note">Traceの線幅とワードマークの太さを揃え、シンボルの右側に十分な呼吸を持たせています。ライム色は3つの節点とピリオドだけに限定しています。</p>
</main>
</body>
</html>
